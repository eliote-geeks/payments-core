apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments-frontend
  namespace: payments-core
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pay-dev.79.137.32.27.nip.io
      secretName: pay-dev-tls
  rules:
    - host: pay-dev.79.137.32.27.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payments-frontend
                port:
                  number: 80
---
