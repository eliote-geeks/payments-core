apiVersion: batch/v1
kind: Job
metadata:
  name: hyperswitch-migrations
  namespace: payments-core
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperswitch-migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migration-runner
          image: debian:trixie-slim
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              apt-get update
              apt-get install -y curl git xz-utils ca-certificates
              git clone --depth 1 https://github.com/juspay/hyperswitch.git /tmp/hyperswitch
              curl --proto '=https' --tlsv1.2 -LsSf https://github.com/diesel-rs/diesel/releases/download/v2.3.5/diesel_cli-installer.sh | bash
              curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
              export PATH="$PATH:$HOME/.cargo/bin"
              export DATABASE_URL="postgresql://db_user:${HYPERSWITCH_DB_PASSWORD}@hyperswitch-postgres:5432/hyperswitch_db"
              cd /tmp/hyperswitch
              just migrate
          env:
            - name: HYPERSWITCH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-secrets
                  key: HYPERSWITCH_DB_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hyperswitch
  namespace: payments-core
spec:
  selector:
    app.kubernetes.io/name: hyperswitch
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperswitch
  namespace: payments-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hyperswitch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperswitch
        public-ingress: "true"
    spec:
      containers:
        - name: router
          image: docker.juspay.io/juspaydotin/hyperswitch-router:standalone
          command: ["./router", "-f", "/local/config/docker_compose.toml"]
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /local/config/docker_compose.toml
              subPath: docker_compose.toml
      volumes:
        - name: config
          configMap:
            name: hyperswitch-config
---
apiVersion: v1
kind: Service
metadata:
  name: stellar-platform
  namespace: payments-core
spec:
  selector:
    app.kubernetes.io/name: stellar-platform
  ports:
    - name: sep
      port: 8080
      targetPort: 8080
    - name: platform
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellar-platform
  namespace: payments-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellar-platform
        public-ingress: "true"
    spec:
      containers:
        - name: platform
          image: stellar/anchor-platform:2.11.2
          args: ["--sep-server", "--platform-server", "--event-processor", "--stellar-observer"]
          envFrom:
            - configMapRef:
                name: stellar-config
            - secretRef:
                name: payments-secrets
          ports:
            - containerPort: 8080
              name: sep
            - containerPort: 8085
              name: platform
          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 90
            periodSeconds: 20
          livenessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 150
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config/assets.yaml
              subPath: assets.yaml
            - name: config
              mountPath: /config/stellar.toml
              subPath: stellar.toml
      volumes:
        - name: config
          configMap:
            name: stellar-config
---
apiVersion: v1
kind: Service
metadata:
  name: stellar-reference-server
  namespace: payments-core
spec:
  selector:
    app.kubernetes.io/name: stellar-reference-server
  ports:
    - name: http
      port: 8091
      targetPort: 8091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellar-reference-server
  namespace: payments-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-reference-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellar-reference-server
        public-ingress: "true"
    spec:
      containers:
        - name: reference-server
          image: stellar/anchor-platform:2.11.2
          args: ["--kotlin-reference-server"]
          env:
            - name: KT_REFERENCE_SERVER_CONFIG
              value: /config/reference-config.yaml
          ports:
            - containerPort: 8091
              name: http
          readinessProbe:
            tcpSocket:
              port: 8091
            initialDelaySeconds: 45
            periodSeconds: 20
          livenessProbe:
            tcpSocket:
              port: 8091
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /config/reference-config.yaml
              subPath: reference-config.yaml
      volumes:
        - name: config
          configMap:
            name: stellar-config
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: payments-core
spec:
  selector:
    app.kubernetes.io/name: payments-api
  ports:
