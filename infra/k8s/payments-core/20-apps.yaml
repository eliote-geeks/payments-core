---
apiVersion: v1
kind: Service
metadata:
  name: anchor-ref-health
  namespace: payments-core
spec:
  selector:
    app.kubernetes.io/name: anchor-ref-health
  ports:
    - name: http
      port: 80
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anchor-ref-health
  namespace: payments-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anchor-ref-health
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anchor-ref-health
        public-ingress: "true"
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0.0
          args:
            - -listen=:5678
            - -text={"status":"ok","service":"anchor-ref","path":"/healthz"}
          ports:
            - containerPort: 5678
              name: http
          readinessProbe:
            tcpSocket:
              port: 5678
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
