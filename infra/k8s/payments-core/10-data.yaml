apiVersion: v1
kind: Service
metadata:
  name: payments-api-postgres
  namespace: payments-core
spec:
  selector:
    app.kubernetes.io/name: payments-api-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payments-api-postgres
  namespace: payments-core
spec:
  serviceName: payments-api-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: payments-secrets
                  key: PAYMENTS_API_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-secrets
                  key: PAYMENTS_API_DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: payments-secrets
                  key: PAYMENTS_API_DB_NAME
          readinessProbe:
            exec:
              command: ["sh", "-lc", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 4Gi
---
