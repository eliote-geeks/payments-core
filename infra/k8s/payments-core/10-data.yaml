apiVersion: v1
kind: Service
metadata:
  name: hyperswitch-redis
  namespace: payments-core
spec:
  selector:
    app.kubernetes.io/name: hyperswitch-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperswitch-redis
  namespace: payments-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hyperswitch-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperswitch-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stellar-kafka
  namespace: payments-core
spec:
  selector:
    app.kubernetes.io/name: stellar-kafka
  ports:
    - name: kafka
      port: 29092
      targetPort: 29092
    - name: controller
      port: 29096
      targetPort: 29096
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellar-kafka
  namespace: payments-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellar-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.4.3
          ports:
            - containerPort: 29092
              name: kafka
            - containerPort: 29096
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@stellar-kafka:29096
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: CLUSTER_ID
              value: ciWo7IWazngRchmPES6q5A==
            - name: KAFKA_LOG_DIRS
              value: /tmp/kraft-combined-logs
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29096
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://stellar-kafka:29092
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
